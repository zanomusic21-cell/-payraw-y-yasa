<h1>🔥 ئاژاوەچیەکانی ئەکەتیڤ</h1>
<p class="sub">سیستەمی نۆبەی ٣٢ کەس — Done بۆ گەڕاندنەوەی نۆبەی دواتر</p>
<div id="app"><div class="card">چاوەڕوانی داتا...</div></div></div>

<script>
const SUPABASE_URL="https://xercprrghfldudyqtcup.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_GBPfIw8gk4NC1OvQ5kk9zA_begukXbo";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const REQUIRED=12,TOTAL=32;
const clientId=localStorage.getItem("payraw_client")||(crypto.randomUUID?crypto.randomUUID():String(Date.now()));
localStorage.setItem("payraw_client",clientId);

let round=null, members=[], dones=[], watched=false;

const $=id=>document.getElementById(id);
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function key(){return "payraw_watched_"+(round?.id||"")+"_"+(round?.active_position||1);}
function setWatched(v){watched=v; if(v)localStorage.setItem(key(),"1"); render();}

async function load(){
  try{
    const {data:r,error:re}=await sb.from("rounds").select("*").order("id",{ascending:false}).limit(1).maybeSingle();
    if(re) throw re;
    if(!r) throw new Error("هیچ Round ـێک لە Supabase نەدۆزرایەوە.");
    round=r;

    const {data:p,error:pe}=await sb.from("participants").select("*").order("position",{ascending:true}).limit(TOTAL);
    if(pe) throw pe;
    members=p||[];

    const {data:d,error:de}=await sb.from("done_records").select("*").eq("round_id",round.id);
    if(de) throw de;
    dones=d||[];

    watched=localStorage.getItem(key())==="1";
    render();
  }catch(e){
    $("app").innerHTML='<div class="card"><div class="status err">❌ Supabase پەیوەست نەبوو<br>'+esc(e.message)+'</div></div>';
  }
}

function render(){
  const pos=Number(round?.active_position||1);
  const person=members.find(x=>Number(x.position)===pos)||members[pos-1];
  const count=dones.length;
  const already=dones.some(x=>x.client_id===clientId);
  const canDone=watched&&!already&&count<REQUIRED;
  const pct=Math.min(100,Math.round(count/REQUIRED*100));

  $("app").innerHTML=`
    <section class="hero"><img src="design.png" alt="ئاژاوەچیەکانی ئەکتیڤ"></section>
    <h1>ئاژاوەچیەکانی ئەکەتیڤ 🔥</h1>
    <p class="sub">سیستەمی نۆبەی ٣٢ کەس — ١٢ Done بۆ کردنەوەی نۆبەی دواتر</p>

    <section class="card">
      <div class="row"><div class="label">🔴 نۆبەی ئێستا</div><div class="label">Position ${pos}</div></div>
      <div class="username">${esc(person?.username||"@username")}</div>
      <a id="postLink" class="tiktok" href="${esc(person?.tiktok_url||"#")}" target="_blank" rel="noopener">↗ سەیرکردنی ڤیدیۆ / پۆست</a>
      <div class="status ${watched?'ok':''}">${watched?'✓ ڤیدیۆ کراوە — ئێستا Done چالاکە.':'🔒 سەرەتا ڤیدیۆکە تەواو ببینە، پاشان Done چالاک دەبێت.'}</div>
      <button id="doneBtn" class="${canDone?'ready':''}" ${canDone?'':'disabled'}>
        ${already?'✓ Done کراوە':count>=REQUIRED?'⏳ نۆبەی دواتر':canDone?'Done — سەیرم کردووە':'🔒 سەیرکردنی ڤیدیۆ پێویستە'}
      </button>
      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
      <div class="meta"><span>${pct}%</span><span>${count} / ${REQUIRED} Done</span></div>
      <div class="status">${count>=REQUIRED?'✓ ١٢ کەس Done کردووە؛ نۆبەی دواتر ئامادەیە.':'تا ١٢ Done نەبێت نۆبەی دواتر ناکرێتەوە.'}</div>
    </section>

    <section class="card">
      <div class="notice"><b>سیستەمەکە:</b> لە کۆی ${TOTAL} ئەندام، ${REQUIRED} Done پێویستە. Done پێش بینینی ڤیدیۆ ناکرێت.</div>
    </section>
  `;

  $("postLink").onclick=()=>{
    watched=true;
    localStorage.setItem(key(),"1");
    setTimeout(render,300);
  };
  if(canDone) $("doneBtn").onclick=done;
}

async function done(){
  const btn=$("doneBtn");
  if(!watched){alert("سەرەتا ڤیدیۆکە ببینە.");return;}
  btn.disabled=true;
  try{
    const {error}=await sb.from("done_records").insert({round_id:round.id,client_id:clientId});
    if(error) throw error;

    const {data,error:qe}=await sb.from("done_records").select("id,client_id").eq("round_id",round.id);
    if(qe) throw qe;
    dones=data||[];

    if(dones.length>=REQUIRED){
      const next=Number(round.active_position||1)+1;
      const {error:ue}=await sb.from("rounds").update({active_position:next,status:"active"}).eq("id",round.id);
      if(ue) throw ue;
      await sb.from("done_records").delete().eq("round_id",round.id);
    }
    await load();
  }catch(e){
    btn.disabled=false;
    alert("❌ هەڵە: "+e.message);
  }
}

load();
</script>
</body></html>
